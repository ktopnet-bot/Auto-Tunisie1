<script>
const K='carnet-auto-tn-v2';
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{cars:[],es:[],sel:null};
let tab='hist',menu=false,q='',sch=false;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const ymd=x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const nf=(x,d)=>(+x).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const tnd=x=>nf(x,3)+' TND', kmf=x=>nf(Math.round(x),0)+' km';
const dshort=d=>new Date(d+'T00:00').toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
const dlong=d=>new Date(d+'T00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
const mname=(m,o)=>new Date(m+'-01T00:00').toLocaleDateString('fr-FR',o);
function toast(t){$('#ts').innerHTML=`<div class="toast">${t}</div>`;setTimeout(()=>$('#ts').innerHTML='',2200)}
const FUELS=['Essence','Gasoil','Gasoil 50','GPL'];
const SVC={'Vidange moteur':[10000,0],'Filtre à huile':[10000,0],'Filtre à air':[20000,0],'Filtre à carburant':[30000,0],'Bougies':[30000,0],'Courroie de distribution':[80000,0],'Plaquettes de frein':[30000,0],'Pneus':[40000,0],'Batterie':[0,0],'Visite technique':[0,0],'Vignette':[0,12],'Assurance':[0,12],'Autre':[0,0]};
Object.assign(SVC,{"Changement d'huile":[10000,0],'Changement des freins':[30000,0],'Changement de Roues':[40000,0],'Contrôle technique':[0,0],'Courroies':[0,0],'Chaine De Distribution':[0,0]});
const DEFTYPES=['Assurance','Autre','Batterie','Bougies','Ceintures de sécurité','Chaine De Distribution','Changement Position Roues',"Changement d'huile",'Changement de Roues','Changement des freins','Circuit de chauffage','Circuit de refroidissement','Climatisation','Contrôle','Contrôle technique','Corps/Châssis','Courroies',"Coût de main-d'œuvre",'Faux Moteur','Filtre à air','Filtre à carburant','Filtre à huile','Pneus','Vignette'];
const types=()=>[...(S.types&&S.types.length?S.types:DEFTYPES)].sort((a,b)=>a.localeCompare(b,'fr'));
const svcList=v=>{const l=types();if(v&&!l.includes(v))l.push(v);return l};
let tpL=[];

 if(t==='itineraire'){if(!(x.km0>0))E.push(['km0','Km de départ obligatoire']);if(!(x.km>0))E.push(['km','Km d\'arrivée obligatoire']);else if(x.km0>0&&x.km<=x.km0)E.push(['km','Doit dépasser le km de départ'])}
 if(t==='rappel'){if(!x.title.trim())E.push(['title','Titre obligatoire']);if(!x.nd&&!x.nk){E.push(['nd','Date ou kilométrage obligatoire']);E.push(['nk','Date ou kilométrage obligatoire'])}}
 if(t==='liste'){if(!x.title.trim())E.push(['title','Titre obligatoire']);if(!x.items.length)E.push(['items','Ajoutez au moins un élément'])}
 return E;
}

 const d=calc(),x=buildX(t,d);gTried=true;const E=gErrs(t,x,d);gShow(E);
 if(E.length){buzz();toast('Corrigez les champs en rouge');const f=$('#f_'+E[0][0]);if(f){f.scrollIntoView({block:'center'});f.focus()}return}
 if(!x.date)x.date=today();

function detail(id){
 const d=calc(),x=S.es.find(e=>e.id===id);if(!x)return;

 else b=`<div class="row"><span>Date</span><b>${dlong(x.date)}</b></div>`+(x.km?`<div class="row"><span>Kilométrage</span><b>${kmf(x.km)}</b></div>`:'')+(x.t==='plein'?`<div class="row"><span>Litres × prix</span><b>${nf(x.l,3)} L × ${nf(x.p,3)}</b></div><div class="row"><span>Total</span><b>${tnd(pt(x))}</b></div>${d.cons[id]?`<div class="row"><span>Consommation</span><b>${nf(d.cons[id],3)} L/100km</b></div>`:''}<div class="row"><span>Réservoir plein</span><b>${x.full?'Oui':'Non'}</b></div>${x.station?`<div class="row"><span>Station service</span><b>${esc(x.station)}</b></div>`:''}${x.driver?`<div class="row"><span>Conducteur</span><b>${esc(x.driver)}</b></div>`:''}`:'')+(x.cost?`<div class="row"><span>Montant</span><b>${tnd(x.cost)}</b></div>`:'')+(x.note?`<div class="row"><span>Note</span><b>${esc(x.note)}</b></div>`:'');
 sheet(`<h3>${ic} ${lab}</h3>${b}<div class="acts"><button class="btn" data-edit="${id}">Modifier</button><button class="btn r" data-del="${id}">Supprimer</button><button class="btn g" data-close="1">Fermer</button></div>`);

function copyOut(t,ok){
 const fb=()=>{$('#ov').innerHTML=`<div class="pg"><div class="ph t"><button class="ib" data-close="1" aria-label="Retour">←</button><span>Exporter</span></div><div class="pb"><p class="mut2">Copie automatique impossible. Appuyez longuement dans la zone, choisissez « Tout sélectionner », puis « Copier ».</p><textarea id="exo" rows="14" readonly></textarea></div></div>`;const a=$('#exo');a.value=t;a.focus();a.select()};

}
function csv(){
 const d=calc();if(!d){toast('Aucune donnée');return}
 const q=v=>{v=String(v??'').replace(/\n/g,' ');return /[;"]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
 const rows=[['date','heure','type','km','km_depart','litres','prix_litre','montant_TND','carburant','reservoir_plein','station','conducteur','categorie','note','prochain_km','prochaine_date','elements']].concat([...d.e].sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.time||'',IC[x.t][2],x.km||'',x.km0||'',x.l||'',x.p||'',x.t==='plein'?pt(x).toFixed(3):(x.cost||''),x.fuel||'',x.t==='plein'?(x.full?'oui':'non'):'',x.station||'',x.driver||'',x.svc||x.cat||x.title||'',x.note||'',x.nk||'',x.nd||'',x.items?x.items.map(i=>i.x).join('|'):'']));
 copyOut(rows.map(r=>r.map(q).join(';')).join('\n'),'CSV copié');
}
function backup(){
 if(!S.cars.length){toast('Aucune donnée');return}
 copyOut(JSON.stringify({v:1,cars:S.cars,es:S.es,types:S.types||null}),'Sauvegarde copiée');
}
const s2=v=>String(v??'').slice(0,200);
const n2=v=>{const a=parseFloat(String(v??'').replace(/\s/g,'').replace(',','.'));return isFinite(a)&&a>=0?a:0};
function fdate(v){v=String(v||'').trim();let m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''}
function norm(x){
 const t=x.t;if(!IC[t])return'type inconnu';
 const e={id:s2(x.id)||uid(),car:x.car,t,date:fdate(x.date)};
 if(t!=='rappel'&&!e.date)return'date invalide';
 if(t==='rappel')e.date=e.date||today();
 e.km=n2(x.km);e.note=s2(x.note);
 if(t==='plein'){e.time=s2(x.time);e.fuel=s2(x.fuel);e.station=s2(x.station);e.driver=s2(x.driver);e.p=n2(x.p);e.l=n2(x.l);e.tot=n2(x.tot);e.full=x.full!==false;
  if(!e.p&&e.l&&e.tot)e.p=r3(e.tot/e.l);if(!e.l&&e.p&&e.tot)e.l=r3(e.tot/e.p);if(!e.tot&&e.p&&e.l)e.tot=r3(e.p*e.l);
  if(!(e.km>0&&e.p>0&&e.l>0))return'plein incomplet (compteur, prix ou litres)'}
 else if(t==='entretien'){e.svc=s2(x.svc)||'Autre';e.cost=n2(x.cost);e.nk=n2(x.nk);e.nd=fdate(x.nd)}
 else if(t==='depense'||t==='revenu'){e.cat=s2(x.cat)||'Autre';e.cost=n2(x.cost);if(!(e.cost>0))return'montant manquant'}
 else if(t==='releve'){if(!(e.km>0))return'compteur manquant'}
 else if(t==='itineraire'){e.km0=n2(x.km0);e.cat=s2(x.cat)||'Travail';if(!(e.km0>0&&e.km>e.km0))return'km de départ ou d\'arrivée invalide'}
 else if(t==='rappel'){e.title=s2(x.title);e.kind=x.kind==='depense'||x.kind==='entretien'?x.kind:'';e.type=s2(x.type)||e.title;e.rep=!!x.rep;e.uk=x.uk!==undefined?!!x.uk:!!n2(x.nk);e.ud=x.ud!==undefined?!!x.ud:!!fdate(x.nd);e.nk=n2(x.nk);e.nd=fdate(x.nd);e.ik=n2(x.ik);e.iv=n2(x.iv);e.iu=['jours','mois','années'].includes(x.iu)?x.iu:'mois';e.sk=n2(x.sk);e.sd=fdate(x.sd)||e.date;if(!e.title||(!e.nk&&!e.nd&&!e.ik&&!e.iv))return'rappel incomplet'}
 else if(t==='liste'){e.title=s2(x.title);e.items=(Array.isArray(x.items)?x.items:[]).map(i=>({x:s2(i&&i.x!==undefined?i.x:i),d:!!(i&&i.d)})).filter(i=>i.x);if(!e.title||!e.items.length)return'liste incomplète'}
 return e;
}
function pcsv(l,d){const o=[];let c='',q=false;for(let i=0;i<l.length;i++){const ch=l[i];if(q){if(ch==='"'){if(l[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===d){o.push(c);c=''}else c+=ch}o.push(c);return o}
const TY={plein:'plein',entretien:'entretien',depense:'depense','le revenu':'revenu',revenu:'revenu',releve:'releve',itineraire:'itineraire',rappel:'rappel','liste de controle':'liste',liste:'liste'};
function impPage(){
 $('#ov').innerHTML=`<div class="pg"><div class="ph t"><button class="ib" data-close="1" aria-label="Retour">←</button><span>Importer</span></div><div class="pb"><p class="mut2">Importez un fichier CSV ou JSON créé avec l'exportation de l'application, ou collez son contenu. Les entrées déjà présentes ne sont pas dupliquées. Le CSV est ajouté à la voiture sélectionnée.</p><label for="imf">Fichier</label><input id="imf" type="file" accept=".csv,.json,.txt,text/csv,application/json,text/plain"><label for="imt">Ou collez le contenu</label><textarea id="imt" rows="8" placeholder="date;heure;type;km;…"></textarea><div id="imr" role="status" style="margin-top:10px"></div><button class="pill" data-a="imrun">IMPORTER</button></div></div>`;
 $('#imf').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#imt').value=String(r.result);$('#imt').classList.remove('bad')};r.onerror=()=>{$('#imr').innerHTML='<div class="em" style="font-size:16px">Lecture du fichier impossible.</div>'};r.readAsText(f)};
}
function doImport(){
 const txt=$('#imt').value.trim().replace(/^\uFEFF/,''),out=$('#imr');
 const bad=m=>{out.innerHTML='<div class="em" style="font-size:16px" role="alert">'+m+'</div>';buzz()};
 if(!txt){$('#imt').classList.add('bad');bad('Choisissez un fichier ou collez le contenu.');return}
 $('#imt').classList.remove('bad');
 let add=0,skip=0;const errs=[],keys=new Set();
 const key=e=>[e.car,e.t,e.date,e.km,e.tot||e.cost||'',e.svc||e.cat||e.title||'',e.l||''].join('|');
 S.es.forEach(e=>keys.add(key(e)));
 const ids=new Set(S.es.map(e=>e.id));
 const put=(e,lbl)=>{if(typeof e==='string'){errs.push(lbl+' : '+e);return}
  if(ids.has(e.id)||keys.has(key(e))){skip++;return}
  ids.add(e.id);keys.add(key(e));S.es.push(e);add++;
  if(e.t==='entretien'&&!types().includes(e.svc))S.types=[...types(),e.svc]};
 try{
  if(txt[0]==='{'){
   const j=JSON.parse(txt);
   if(!j||!Array.isArray(j.es)||!Array.isArray(j.cars))throw new Error('format JSON non reconnu');
   j.cars.forEach(c=>{if(c&&c.id&&c.name&&!S.cars.some(z=>z.id===c.id))S.cars.push({id:s2(c.id),name:s2(c.name),model:s2(c.model),plate:s2(c.plate),fuel:s2(c.fuel)||'Essence',tank:n2(c.tank),km0:n2(c.km0)})});
   j.es.forEach((x,i)=>{if(!x||!S.cars.some(z=>z.id===x.car)){errs.push('Entrée '+(i+1)+' : voiture introuvable');return}put(norm(x),'Entrée '+(i+1))});
   if(Array.isArray(j.types))S.types=[...new Set([...types(),...j.types.map(s2)])];
   if(!S.sel&&S.cars[0])S.sel=S.cars[0].id;
  }else{
   const lines=txt.split(/\r?\n/).filter(l=>l.trim());
   const dl=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',';
   const rows=lines.map(l=>pcsv(l,dl)),H=rows[0].map(h=>h.trim().toLowerCase());
   if(!H.includes('date')||!H.includes('type'))throw new Error('en-têtes « date » et « type » introuvables');
   const c=car();if(!c){bad('Ajoutez d\'abord une voiture.');return}
   const g=(r,n)=>{const i=H.indexOf(n);return i<0?'':String(r[i]||'').trim()};
   for(let k=1;k<rows.length;k++){const r=rows[k],lbl='Ligne '+(k+1);
    const tn=g(r,'type').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(!TY[tn]){errs.push(lbl+' : type « '+g(r,'type')+' » inconnu');continue}
    let cat=g(r,'categorie'),note=g(r,'note');if(!cat&&['entretien','depense','revenu','rappel','liste'].includes(TY[tn])){cat=note;note=''}
    put(norm({t:TY[tn],car:c.id,date:g(r,'date'),time:g(r,'heure'),km:g(r,'km'),km0:g(r,'km_depart'),l:g(r,'litres'),p:g(r,'prix_litre'),tot:g(r,'montant_tnd'),cost:g(r,'montant_tnd'),fuel:g(r,'carburant'),full:!['non','0','false'].includes(g(r,'reservoir_plein').toLowerCase()),station:g(r,'station'),driver:g(r,'conducteur'),svc:cat,cat,title:cat,note,nk:g(r,'prochain_km'),nd:g(r,'prochaine_date'),items:g(r,'elements').split('|').filter(Boolean)}),lbl)}
  }
 }catch(e){bad('Fichier illisible : '+esc(e.message));return}
 save();render();
 out.innerHTML=`<div style="color:var(--ok);font-size:17px" role="status">${add} entrée(s) importée(s)${skip?', '+skip+' déjà présente(s)':''}.</div>`+errs.slice(0,8).map(m=>`<div class="em" style="font-size:15px">${esc(m)}</div>`).join('')+(errs.length>8?`<div class="em">… et ${errs.length-8} autre(s) erreur(s)</div>`:'');
 if(errs.length)buzz();
}

 if(D.a==='about'){$('#ov').innerHTML=`<div class="pg"><div class="ph t"><button class="ib" data-close="1" aria-label="Retour">←</button><span>À propos</span></div><div class="pb" style="text-align:center;padding-top:40px"><div style="font-size:64px" aria-hidden="true">🚗</div><h2 style="font-size:28px;margin:10px 0 4px">Auto Tunisie</h2><div class="mut2">Version 1.9</div><p style="margin:24px 0;font-size:18px">Suivez la consommation, les pleins, l'entretien et les dépenses de votre voiture, en dinars tunisiens (TND).</p><hr style="border:0;border-top:1px solid var(--line)"><div class="mut2" style="margin-top:20px">Créé par</div><div style="font-size:24px;font-weight:500;margin-top:4px">Kamel Nasralli</div></div></div>`;return}
 if(D.a==='share'){shareSummary();return}

 if(D.a==='per'){perPage();return}
 if(D.per==='cus'){cusPage();return}
 if(D.per){per=D.per;S.per=per;save();close();render();return}
 if(D.a==='cusok'){const f=$('#c1').value,t=$('#c2').value;if(!f||!t||f>t){toast('Choisissez une période valide');return}S.pf=f;S.pt=t;per='cus';S.per=per;save();close();render();return}
 if(D.rt){rtab=D.rt;render();return}
 if(D.t){tab=D.t;menu=false;render();window.scrollTo(0,0);return}
 if(D.new){newForm(D.new);return}

 if(D.edit){const z=S.es.find(q=>q.id===D.edit);if(z)newForm(z.t,z);return}
 if(D.open){detail(D.open);return}
 if(D.ck){const [id,n]=D.ck.split(':'),x=S.es.find(z=>z.id===id);x.items[n].d=t.checked;save();return}
 if(D.del){if(!t.dataset.arm){t.dataset.arm=1;t.textContent='Confirmer ?';return}S.es=S.es.filter(x=>x.id!==D.del);save();close();render();return}
 if(D.ok){D.ok==='plein'?savePlein():saveNew(D.ok);return}
 if(D.a==='more'){$('#p_more').hidden=false;t.hidden=true;return}
 if(D.a==='fab'){menu=!menu;render();return}
 if(D.a==='srch'){sch=!sch;if(!sch)q='';render();return}
 if(D.a==='csv'){csv();return}
 if(D.a==='theme'){const r=document.documentElement;r.dataset.theme=(r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches))?'light':'dark';return}
 if(D.a==='cars'){carsList();return}
 if(D.pick){S.sel=D.pick;save();close();render();return}
 if(D.a==='addcar'){carForm();return}
 if(D.a==='editcar'){carForm(S.cars.find(c=>c.id===D.cid));return}
 if(D.a==='delcar'){const c=S.cars.find(z=>z.id===D.cid);if(!c)return;const n=S.es.filter(x=>x.car===c.id).length;
  if(!t.dataset.arm){t.dataset.arm=1;t.textContent='Confirmer'+(n?' (+ '+n+' entrée'+(n>1?'s':'')+')':'')+' ?';return}
  S.cars=S.cars.filter(z=>z.id!==c.id);S.es=S.es.filter(x=>x.car!==c.id);if(S.sel===c.id)S.sel=S.cars[0]?S.cars[0].id:'';save();close();render();toast('Voiture supprimée');return}
 if(D.a==='savecar'){const n=$('#cn').value.trim();if(!n){$('#cn').focus();return}
  const tk=num($('#ct').value);if($('#ct').value.trim()&&!(tk>0&&tk<=500)){$('#ct').classList.add('shake');$('#ct').focus();toast('Capacité non valide');return}
  const o={name:n,model:$('#cm').value.trim(),plate:$('#cp').value.trim(),fuel:$('#cf').value,tank:tk>0?tk:0,km0:+$('#ck0').value||0};
  if(D.cid){Object.assign(S.cars.find(c=>c.id===D.cid),o)}else{const c={id:uid(),...o};S.cars.push(c);S.sel=c.id}
  save();close();render()}
});
